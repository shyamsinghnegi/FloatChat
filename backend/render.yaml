services:
  - type: web
    name: floatchat-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python download_model.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: ALLOWED_ORIGIN
        sync: false
      - key: CHROMA_PATH
        value: ./chroma_db
      - key: HF_TOKEN
        sync: false
      # Forces the HF cache into the project directory, which Render persists
      # from build into runtime - the default (~/.cache) may not survive that
      # boundary, which is why the model was still re-downloading per-request
      # even after the build step ran download_model.py.
      - key: HF_HOME
        value: ./.hf_cache
