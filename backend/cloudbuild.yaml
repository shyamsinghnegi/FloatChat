steps:
  # Pull the last built image (if any) so unchanged layers - torch, system libs,
  # the baked-in embedding model - are reused instead of rebuilt from scratch
  # every time. Without this, every push paid the full ~5min torch install cost
  # even for a one-line code change.
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'docker pull asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/floatchat-api:latest || exit 0'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/floatchat-api:latest'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/floatchat-api:$SHORT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/floatchat-api:latest'
      - '.'
    dir: 'backend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/floatchat-api'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'floatchat-api'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/floatchat-api:$SHORT_SHA'
      - '--region=asia-south1'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/floatchat-api:$SHORT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/floatchat-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
